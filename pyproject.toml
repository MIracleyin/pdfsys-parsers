[project]
name = "pdfsys-parsers"
version = "0.1.0"
description = "Parser submodule for pdfsystem_mnbvc — mupdf/pipeline/vlm/layout-analyser + vendored pdfsys-types."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNBVC Contributors" }]

# The repo is consumed primarily as a submodule of `pdfsys` (main repo).
# The root project depends on every workspace package so that `uv sync` at the
# repo root installs the entire submodule in one shot (used by the parsers-repo
# CI and by anyone hacking on the submodule in isolation).
dependencies = [
    "pdfsys-types",
    "pdfsys-parser-mupdf",
    "pdfsys-parser-pipeline",
    "pdfsys-parser-vlm",
    "pdfsys-layout-analyser",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pdfsys-types           = { workspace = true }
pdfsys-parser-mupdf    = { workspace = true }
pdfsys-parser-pipeline = { workspace = true }
pdfsys-parser-vlm      = { workspace = true }
pdfsys-layout-analyser = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
